name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write # commit the updated package.json and lockfile

# Runs one at a time with the release workflow, both push to main
concurrency:
  group: push-to-main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Respects minimumReleaseAge from pnpm-workspace.yaml
      - run: pnpm update --latest
      - run: pnpm run lint
      - run: pnpm test
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(deps): update dependencies"
          file_pattern: package.json pnpm-lock.yaml
